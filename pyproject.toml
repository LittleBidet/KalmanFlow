[project]
name = "kalmanflow"
version = "0.1.0a3"
description = "Causal filtering and fixed-lag inflow revisions for reservoir inflow estimation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.5",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/LittleBidet/KalmanFlow"
Issues = "https://github.com/LittleBidet/KalmanFlow/issues"
Documentation = "https://github.com/LittleBidet/KalmanFlow/tree/main/Documentation"

[project.optional-dependencies]
tuning = [
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "plotly>=6.9.0",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]
notebook = [
    "jupyter",
    "matplotlib",
    "plotly",
]

[tool.uv.build-backend]
source-include = [
    "Documentation/**",
]
source-exclude = [
    "/src/kalmanflow/.DS_Store",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.uv-cache",
    "/.venv",
    "/build",
    "/dist",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/kalmanflow", "applications", "Notebooks", "main"]

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true

[tool.ruff]
extend-exclude = [
    ".uv-cache",
    ".venv",
    "build",
    "dist",
]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
