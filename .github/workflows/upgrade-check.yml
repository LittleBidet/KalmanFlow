name: Upgrade check

# Runs the tests against the newest allowed dependencies, ignoring uv.lock, so
# a breaking upstream release shows up here instead of in unrelated work.
on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/upgrade-check.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgraded:
    name: Newest dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"
          python-version: "3.14"

      - name: Install the newest allowed dependencies
        run: uv sync --upgrade --group dev --extra tuning

      - name: Show resolved versions
        run: uv pip list

      - name: Run tests
        run: uv run --no-sync python -m pytest --cov --cov-report=term-missing
